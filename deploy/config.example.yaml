# overcast 配置模板:占位符由金库渲染,真值永不进仓(渲染后 0600)
# 形制核验:上游 v8.0.23 config.example.yaml 与 config_types.go + 2026-10-11 lan-mac 实测
#
# 纪律:
# - port 必写:缺省时上游监听随机端口(:0),宿主 8317 映射落空(2026-10-11 实测坑)
# - base-url 不写 /chat/completions 后缀(执行器自接)
# - 两把 key 必须同种产品:通用开放平台 key 配 paas/v4 与 /api/v1;编码套餐 key 配
#   https://open.bigmodel.cn/api/coding/paas/v4,不混填同一 base
# - openai-compatibility 组多 key 用 api-key-entries;claude-api-key 组多 key
#   必须拆成多个条目、每条一个 api-key(api-key-entries 在该组不生效,2026-10-11 实测:
#   载入 1 个空 key 客户端,上游 401;拆两条目后载入 2 Claude API keys)
# - xai-api-key 组(Responses 原生执行器)legacy 形每条目一把 key(同 CodexKey 形),
#   无 name: 字段、无 keys: 列表(2026-10-11 对照上游 config_types.go 核验)
# - 上游 v8 另有根 api-keys: 新版式(组内 keys: 列表),legacy 拼法仍受支持;
#   本模板沿用 legacy 拼法,迁新版式待上游再核
# - 智谱各组显式 disable-cooling: false(不继承舰队旧模板的全局 true)
# - 客户端可见名按调用方拆开,同一名字不能跨执行器:Claude Code 用 zp-cc-*,
#   Codex 用 zp-cx-*(responses 为 zp-cx-glm53 / zp-cx-glm5t,chat 为 zp-cx-chat)。
#   别名替换上游名。Claude 组另挂一条 alias glm-5.3,旧会话剥掉 [1m] 后发的裸名仍进
#   messages 执行器。Codex 只用 zp-cx-*,不登记裸名

port: 8317

routing:
  strategy: round-robin
  session-affinity: false
  retry:
    request-retry: 3
    max-retry-credentials: 0
    max-retry-interval: 30
  cooldown:
    disable-cooling: false

# chat 面(OpenAI 兼容):chat 客户端走这组
openai-compatibility:
  - name: glm
    base-url: "https://open.bigmodel.cn/api/paas/v4"
    disable-cooling: false
    request-retry: 3
    api-key-entries:
      - api-key: "{{cpa_zhipu_key}}"
      - api-key: "{{cpa_zhipu_key_2}}"
    models:
      - name: "glm-5.3"
        alias: "zp-cx-chat"
  # DeepSeek 官方(REQ-003,2026-10-13):OpenAI 面;codex 的 responses 请求经本组执行器
  # 翻译成 chat 发上游(上游 chat-only,与智谱 /api/v1 Responses-only 相反,翻译在该上游是正道);
  # flash 用新名 deepseek-flash(旧名 deepseek-v4-flash / deepseek-v4 已弃用,官方文档口径)
  - name: deepseek
    base-url: "https://api.deepseek.com"
    disable-cooling: false
    request-retry: 3
    api-key-entries:
      - api-key: "{{cpa_deepseek_key}}"
    models:
      - name: "deepseek-v4-pro"
        alias: "ds-cx-pro"
      - name: "deepseek-flash"
        alias: "ds-cx-flash"

# messages 面(Claude Code 走这组):chat 池与 messages 池互不代替
claude-api-key:
  - name: glm-claude
    base-url: "https://open.bigmodel.cn/api/anthropic"
    disable-cooling: false
    api-key: "{{cpa_zhipu_key}}"
    models:
      - name: "glm-5.3"
        alias: "zp-cc-glm53"
      - name: "glm-5.3"
        alias: "glm-5.3"
      - name: "glm-5.3-flash"
        alias: "zp-cc-glm53fh"
  - name: glm-claude-b
    base-url: "https://open.bigmodel.cn/api/anthropic"
    disable-cooling: false
    api-key: "{{cpa_zhipu_key_2}}"
    models:
      - name: "glm-5.3"
        alias: "zp-cc-glm53"
      - name: "glm-5.3"
        alias: "glm-5.3"
      - name: "glm-5.3-flash"
        alias: "zp-cc-glm53fh"
  # zyuncs 备供应商条目(2026-10-12 grok 新增):base 不带 /v1;flash 以 z-ai/glm-5.3-flash 形挂
  - name: zyuncs-claude
    base-url: "https://llm.api.zyuncs.com"
    disable-cooling: false
    api-key: "{{cpa_zyuncs_key}}"
    models:
      - name: "z-ai/glm-5.3"
        alias: "zp-cc-glm53"
      - name: "z-ai/glm-5.3"
        alias: "glm-5.3"
      - name: "z-ai/glm-5.3-flash"
        alias: "zp-cc-glm53fh"
  # DeepSeek 官方(REQ-003,2026-10-13):Anthropic 兼容面,CC 走 messages;pro+flash 双模型
  - name: deepseek-claude
    base-url: "https://api.deepseek.com/anthropic"
    disable-cooling: false
    api-key: "{{cpa_deepseek_key}}"
    models:
      - name: "deepseek-v4-pro"
        alias: "ds-cc-pro"
      - name: "deepseek-flash"
        alias: "ds-cc-flash"

# responses 面(OpenAI Responses wire 客户端走 /v1/responses):上游智谱开放平台 /api/v1
# 上游 /api/v1 是 Responses-only 面(2026-10-11 直探:chat/completions 对 glm-5.3 与
# glm-5-turbo 均 403 model_access_denied;/responses 双模型 200)。openai-compatibility
# 执行器会把 Responses 请求翻译成 chat 发上游,在该 base 必 403,故用 xai-api-key 组
# (CPA 原生 Responses 执行器)直通上游 /responses;实测经网关 /v1/responses 双模型 200
xai-api-key:
  - api-key: "{{cpa_zhipu_key}}"
    base-url: "https://open.bigmodel.cn/api/v1"
    disable-cooling: false
    request-retry: 3
    models:
      - name: "glm-5.3"
        alias: "zp-cx-glm53"
      - name: "glm-5.3-flash"
        alias: "zp-cx-glm53fh"
      - name: "glm-5-turbo"
        alias: "zp-cx-glm5t"
  - api-key: "{{cpa_zhipu_key_2}}"
    base-url: "https://open.bigmodel.cn/api/v1"
    disable-cooling: false
    request-retry: 3
    models:
      - name: "glm-5.3"
        alias: "zp-cx-glm53"
      - name: "glm-5.3-flash"
        alias: "zp-cx-glm53fh"
      - name: "glm-5-turbo"
        alias: "zp-cx-glm5t"
  # zyuncs 备供应商条目(2026-10-12 grok 新增,同池轮换:智谱自费 key 额度尽时接力)
  # 模型名形 z-ai/glm-5.3(zyuncs 形);responses 面单条目,无 glm5t 别名
  - api-key: "{{cpa_zyuncs_key}}"
    base-url: "https://llm.api.zyuncs.com/v1"
    disable-cooling: false
    request-retry: 3
    models:
      - name: "z-ai/glm-5.3"
        alias: "zp-cx-glm53"

# 客户端进网关的钥匙,与智谱 key 分开;客户端只见这里发的 key
# 鉴权开关 deploy/auth-toggle.sh on|off|status:off 把条目全注释(零条目=零 provider 放行,
# 任意 token 与无 Authorization 头均可,语义源分叉仓 sdk/access/manager.go),on 还原并重启自检。
# 现态 off(2026-10-13 用户裁定,内网免鉴权);模板保持渲染态形制,开关只动部署位实例。
access:
  api-keys:
    - "{{overcast_gateway_key}}"

# 管理面保持默认关闭远程
management:
  allow-remote: false

# requests 段(思考块调试注入,原能力二 v1)已剔除:2026-10-12 用户裁定 scope 收敛为双 token 轮换 + vector/CH 观测道(REQ-002);历史形制见 git 史 7bfb2c8 模板档

# 对话观测道(REQ-002,补丁 v8.0.23-dialog1):异步 JSONL 小时轮换(学 Suricata 形),
# 全量请求体/响应字节/凭据轮换事件落 dialoglogs 卷,队列满只丢观测事件不挡请求;
# 盘容有界:dialog-log-max-total-size-mb 大于 0 时按分钟删最旧(活跃文件不动)
# dialog-log: true
# dialog-log-max-total-size-mb: 512
