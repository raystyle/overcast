# overcast 配置模板:占位符由金库渲染,真值永不进仓(渲染后 0600)
# 形制核验:上游 v8.0.23 config.example.yaml 与 config_types.go + 2026-10-11 lan-mac 实测
#
# 纪律:
# - port 必写:缺省时上游监听随机端口(:0),宿主 8317 映射落空(2026-10-11 实测坑)
# - base-url 不写 /chat/completions 后缀(执行器自接)
# - 两把 key 必须同种产品:通用开放平台 key 配 paas/v4 与 /api/v1;编码套餐 key 配
#   https://open.bigmodel.cn/api/coding/paas/v4,不混填同一 base
# - openai-compatibility 组多 key 用 api-key-entries;claude-api-key 组多 key
#   必须拆成多个条目、每条一个 api-key(api-key-entries 在该组不生效,2026-10-11 实测:
#   载入 1 个空 key 客户端,上游 401;拆两条目后载入 2 Claude API keys)
# - xai-api-key 组(Responses 原生执行器)legacy 形每条目一把 key(同 CodexKey 形),
#   无 name: 字段、无 keys: 列表(2026-10-11 对照上游 config_types.go 核验)
# - 上游 v8 另有根 api-keys: 新版式(组内 keys: 列表),legacy 拼法仍受支持;
#   本模板沿用 legacy 拼法,迁新版式待上游再核
# - 智谱各组显式 disable-cooling: false(不继承舰队旧模板的全局 true)
# - 客户端可见名按调用方拆开,同一名字不能跨执行器:Claude Code 用 zp-cc-*,
#   Codex 用 zp-cx-*(responses 为 zp-cx-glm53 / zp-cx-glm5t,chat 为 zp-cx-chat)。
#   别名替换上游名。Claude 组另挂一条 alias glm-5.3,旧会话剥掉 [1m] 后发的裸名仍进
#   messages 执行器。Codex 只用 zp-cx-*,不登记裸名

port: 8317

routing:
  strategy: round-robin
  session-affinity: false
  retry:
    request-retry: 3
    max-retry-credentials: 0
    max-retry-interval: 30
  cooldown:
    disable-cooling: false

# chat 面(OpenAI 兼容):chat 客户端走这组
openai-compatibility:
  - name: glm
    base-url: "https://open.bigmodel.cn/api/paas/v4"
    disable-cooling: false
    request-retry: 3
    api-key-entries:
      - api-key: "{{cpa_zhipu_key}}"
      - api-key: "{{cpa_zhipu_key_2}}"
    models:
      - name: "glm-5.3"
        alias: "zp-cx-chat"

# messages 面(Claude Code 走这组):chat 池与 messages 池互不代替
claude-api-key:
  - name: glm-claude
    base-url: "https://open.bigmodel.cn/api/anthropic"
    disable-cooling: false
    api-key: "{{cpa_zhipu_key}}"
    models:
      - name: "glm-5.3"
        alias: "zp-cc-glm53"
      - name: "glm-5.3"
        alias: "glm-5.3"
      - name: "glm-5.3-flash"
        alias: "zp-cc-glm53fh"
  - name: glm-claude-b
    base-url: "https://open.bigmodel.cn/api/anthropic"
    disable-cooling: false
    api-key: "{{cpa_zhipu_key_2}}"
    models:
      - name: "glm-5.3"
        alias: "zp-cc-glm53"
      - name: "glm-5.3"
        alias: "glm-5.3"
      - name: "glm-5.3-flash"
        alias: "zp-cc-glm53fh"

# responses 面(OpenAI Responses wire 客户端走 /v1/responses):上游智谱开放平台 /api/v1
# 上游 /api/v1 是 Responses-only 面(2026-10-11 直探:chat/completions 对 glm-5.3 与
# glm-5-turbo 均 403 model_access_denied;/responses 双模型 200)。openai-compatibility
# 执行器会把 Responses 请求翻译成 chat 发上游,在该 base 必 403,故用 xai-api-key 组
# (CPA 原生 Responses 执行器)直通上游 /responses;实测经网关 /v1/responses 双模型 200
xai-api-key:
  - api-key: "{{cpa_zhipu_key}}"
    base-url: "https://open.bigmodel.cn/api/v1"
    disable-cooling: false
    request-retry: 3
    models:
      - name: "glm-5.3"
        alias: "zp-cx-glm53"
      - name: "glm-5-turbo"
        alias: "zp-cx-glm5t"
  - api-key: "{{cpa_zhipu_key_2}}"
    base-url: "https://open.bigmodel.cn/api/v1"
    disable-cooling: false
    request-retry: 3
    models:
      - name: "glm-5.3"
        alias: "zp-cx-glm53"
      - name: "glm-5-turbo"
        alias: "zp-cx-glm5t"

# 客户端进网关的钥匙,与智谱 key 分开;客户端只见这里发的 key
access:
  api-keys:
    - "{{overcast_gateway_key}}"

# 管理面保持默认关闭远程
management:
  allow-remote: false

# 能力二 v1:思考块调试注入(payload 配置态,header 门控,零代码;ADR-0001 配置态优先)
# 门控:客户端带 X-Overcast-Debug 头才改请求体,正常流量零改动
# 热改:改本段存盘,file watcher 轻改热加载;新根级段属大改,重启收口(实测)
# 实测(2026-10-11):responses 面 reasoning.effort 上游认(low 无 reasoning 项 / high 带);
# claude 面 thinking.budget_tokens 上游不认(256 与 4096 思考长度无差),不作旋钮;
# claude 面 output_config.effort 认(2026-10-12 直探,low 档思考字符约 157 倍削减);
# system/instructions 为全换语义(净室调试),prepend 合并形留 v2 侧车
requests:
  payload:
    override:
      # effort 档调试:responses 面(/v1/responses;目标格式 codex,来源 responses)
      # 门控字段(headers/from-protocol 等)必须嵌在每个 models 条目内,与 name/protocol
      # 同级;写在规则层会被 Go yaml 静默丢弃,规则退化为无门控裸规则
      # (2026-10-11 对照上游 v8.0.23 config.example.yaml 与 config_types.go 实证)
      # protocol 枚举:openai/gemini/claude/codex/antigravity(目标格式);
      # from-protocol 枚举:openai/responses/gemini/claude(来源格式)
      # 双名字兜底:上游未言明 name 匹配客户端名还是解析后上游名,两种都写
      - models:
          - name: "glm-5.3"
            protocol: codex
            from-protocol: responses
            headers:
              X-Overcast-Debug: "low"
          - name: "zp-cx-glm53"
            protocol: codex
            from-protocol: responses
            headers:
              X-Overcast-Debug: "low"
        params:
          reasoning.effort: "low"
      - models:
          - name: "glm-5.3"
            protocol: codex
            from-protocol: responses
            headers:
              X-Overcast-Debug: "high"
          - name: "zp-cx-glm53"
            protocol: codex
            from-protocol: responses
            headers:
              X-Overcast-Debug: "high"
        params:
          reasoning.effort: "high"
      # 净室调试:claude 面(/v1/messages)全换 system
      - models:
          - name: "glm-5.3"
            protocol: claude
            from-protocol: claude
            headers:
              X-Overcast-Debug: "cleanroom"
          - name: "zp-cc-glm53"
            protocol: claude
            from-protocol: claude
            headers:
              X-Overcast-Debug: "cleanroom"
        params:
          system: "你是调试沙盒。回答前先在思考块里:1)用中文复述任务 2)分步编号推理 3)给出结论置信度。然后输出答案。"
      # flash 低思考档:haiku/后台面提速。zhipu 方言 output_config.effort,
      # 2026-10-12 直探 anthropic 面实证:low 档 thinking 字符 1568 降到 10(约 157 倍),出参 828 降到 118 token(约 7 倍)
      - models:
          - name: "glm-5.3-flash"
            protocol: claude
            from-protocol: claude
            headers:
              X-Overcast-Debug: "flash-low"
          - name: "zp-cc-glm53fh"
            protocol: claude
            from-protocol: claude
            headers:
              X-Overcast-Debug: "flash-low"
        params:
          output_config.effort: "low"
      # 会话级快跑档:一个头把主模型与 flash 面同时降为低思考
      # (CC 会话 env 设 ANTHROPIC_CUSTOM_HEADERS: "X-Overcast-Debug: fast" 即整档快跑)
      - models:
          - name: "glm-5.3"
            protocol: claude
            from-protocol: claude
            headers:
              X-Overcast-Debug: "fast"
          - name: "zp-cc-glm53"
            protocol: claude
            from-protocol: claude
            headers:
              X-Overcast-Debug: "fast"
          - name: "glm-5.3-flash"
            protocol: claude
            from-protocol: claude
            headers:
              X-Overcast-Debug: "fast"
          - name: "zp-cc-glm53fh"
            protocol: claude
            from-protocol: claude
            headers:
              X-Overcast-Debug: "fast"
        params:
          output_config.effort: "low"
    # 假 thinking 锚注入:客户端在 messages[1] 放 assistant 占位轮,网关整块替换为
    # 伪造思考块(智谱 anthropic 面不校验 signature,实测收伪造 thinking)
    override-raw:
      - models:
          - name: "glm-5.3"
            protocol: claude
            from-protocol: claude
            headers:
              X-Overcast-Debug: "anchor"
          - name: "zp-cc-glm53"
            protocol: claude
            from-protocol: claude
            headers:
              X-Overcast-Debug: "anchor"
        params:
          "messages.1.content": "[{\"type\":\"thinking\",\"thinking\":\"(锚定的伪造思考内容)\",\"signature\":\"fake\"},{\"type\":\"text\",\"text\":\"(锚定的助手答复)\"}]"
