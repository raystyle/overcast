# overcast lan-mac 部署形(依据 research-01 部署节;镜像钉 tag,不用 latest)
# 布局:本文件与 config.yaml(金库渲染,0600,不进仓)、auths/(凭据卷)、dialoglogs/(对话观测 JSONL 卷)同目录
# 执行归部署批(单 ov-01 边界:工位只读探测,不代跑)
# 现行镜像为二开自维护构建(对话观测道,REQ-002;2026-10-12 用户裁定不往上游提 PR):
#   cd ~/repos/CLIProxyAPI && git checkout feat/dialog-observation \
#   && docker build -t cli-proxy-api:v8.0.23-dialog7 \
#      --build-arg VERSION=v8.0.23-dialog7 --build-arg COMMIT=31d8d165 .
services:
  cliproxy:
    image: cli-proxy-api:v8.0.23-dialog7
    container_name: overcast
    restart: unless-stopped
    ports:
      - "8317:8317"
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml:ro
      - ./auths:/root/.cli-proxy-api
      - ./dialoglogs:/CLIProxyAPI/logs/dialog
